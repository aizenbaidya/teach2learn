{% extends "base.html" %}

{% block title %}Homepage{% endblock %}

{% block content %}
<div class="vh-100 p-4">
    <div class="nes-container h-100 d-flex flex-column">
        {% if g.user %}
        <div class="d-flex align-items-center">
            <h1 class="mb-0">Teach2Learn</h1>
            <div class="ms-auto d-flex align-items-center justify-content-center gap-2">
                <p class="text-secondary mb-0">{{ g.user.username }}</p>
                <form action="{{ url_for('auth.logout') }}" method="post">
                    <button type="submit" class="nes-btn">Logout</button>
                </form>
            </div>
        </div>
        {% endif %}

        <div class="d-flex gap-4 my-auto">
            <div class="nes-container with-title is-centered w-50">
                <p class="title">Teach</p>
                <a type="button" class="nes-btn is-primary" href="{{ url_for('teach.index') }}">I want to
                    teach!</a>
            </div>
            <div class="nes-container with-title is-centered w-50">
                <p class="title">Learn</p>
                <button type="button" class="nes-btn">I want to learn!</button>
            </div>
        </div>

        <div class="d-flex align-items-center">
            <p class="small mt-auto mb-0 text-secondary">Teach2Learn 0.0.1</p>
            <a href="https://github.com/aizenbaidya/teach2learn" class="ms-auto text-reset" target="_blank"
                rel="noopener noreferrer">
                <i class="nes-icon github-square"></i>
            </a>
        </div>
    </div>
</div>
{% endblock %}
