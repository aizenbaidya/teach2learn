{% extends "base.html" %}

{% block title %}Teach{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='dist/teach-index.css') }}">
<script type="module" src="{{ url_for('static', filename='dist/teach-index.js') }}"></script>
{% endblock %}

{% block content %}
<div class="vh-100 p-4">
    <div class="nes-container h-100 d-flex flex-column position-relative">
        <div class="position-absolute top-0 end-0 m-4 d-flex align-items-center gap-3">
            <span id="timer" data-remaining-seconds="{{ remaining_seconds }}">10:00</span>
            <form id="end-form" method="post" action="{{ url_for('teach.end') }}" class="m-0">
                <button type="submit" class="nes-btn is-error">End</button>
            </form>
        </div>
        <section class="message-list h-100">
            <section class="message -left">
                <i class="nes-bcrikko"></i>
                <div class="nes-balloon from-left">
                    <p id="student-response">Hello!!</p>
                </div>
            </section>
            <section class="message -right mt-auto">
                <div id="teacher-input-div" class="nes-balloon from-right">
                    <textarea id="teacher-input" class="p-0 border-0 w-100" rows="2" autofocus></textarea>
                </div>
                <i class="nes-bcrikko"></i>
            </section>
            <div class="position-absolute bottom-0 start-0 m-4 d-flex flex-column align-items-center gap-2">
                <button type="button" class="nes-btn">
                    <i class="nes-icon file"></i>
                </button>
                <button id="knowledge-graph-button"="button" class="nes-btn">
                    <i class="nes-icon cloud"></i>
                </button>
            </div>
        </section>
    </div>
</div>
{% include "teach/knowledge-graph-dialog.html" %}
{% endblock %}
