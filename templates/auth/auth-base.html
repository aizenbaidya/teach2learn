{% extends "base.html" %}

{% block title %}{{ page_name }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='dist/auth-base.css') }}">
<script src="{{ url_for('static', filename='dist/auth-base.js') }}" defer></script>
{% endblock %}

{% block body %}
<div class="vh-100 p-4 d-flex justify-content-center">
    <div class="nes-container h-100 w-50 d-flex flex-column">
        <h1 class="mb-4">{{ page_name }}</h1>
        <form method="post" class="d-flex flex-column gap-4">
            <div class="nes-field d-flex flex-column">
                <label for="username">Username</label>
                <input name="username" id="username" class="nes-input w-auto" required>
            </div>
            <div class="nes-field d-flex flex-column">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="nes-input w-auto" required>
            </div>
            <button type="submit" class="nes-btn is-primary">{{ page_name }}</button>
        </form>
        <p class="mt-auto">{% block footer %}{% endblock %}</p>
    </div>
</div>
{% endblock %}
