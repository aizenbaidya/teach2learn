{% extends "base.html" %}

{% block title %}{{ page_name }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='dist/auth-base.css') }}">
<script type="module" src="{{ url_for('static', filename='dist/auth-base.js') }}" defer></script>
{% endblock %}

{% block content %}
<div class="vh-100 p-4 d-flex justify-content-center">
    <div class="nes-container h-100 w-50 d-flex flex-column">
        <h1 class="mb-4">{{ page_name }}</h1>
        <form id="auth-form" method="post" class="d-flex flex-column gap-4 mb-0" novalidate>
            <div class="nes-field d-flex flex-column">
                <label for="username-input" class="d-flex">Username<span id="username-error"
                        class="error-text nes-text is-error {{ 'd-none' if not errors.username else '' }} text-end ms-auto">{{
                        errors.username
                        }}</span></label>
                <input type="text" name="username" id="username-input"
                    class="nes-input w-auto {{ 'is-error' if errors.username else '' }}"
                    value="{{ request.form.get('username', '') }}" autofocus required>
            </div>
            <div class="nes-field d-flex flex-column">
                <label for="password-input" class="d-flex">Password<span id="password-error"
                        class="error-text nes-text is-error {{ 'd-none' if not errors.password else '' }} ms-auto">{{
                        errors.password
                        }}</span></label>
                <div id="password-div"
                    class="nes-input w-auto d-flex align-items-center gap-2 {{ 'is-error' if errors.password else '' }}">
                    <input type="password" name="password" id="password-input"
                        class="border-0 bg-transparent p-0 flex-grow-1 me-3"
                        value="{{ request.form.get('password', '') }}" required>
                    <button id="eye-button" type="button" class="border-0 p-0 bg-transparent d-flex align-items-center">
                        <i id="eye-icon" class="nes-icon eye is-small"></i>
                    </button>
                </div>

            </div>
            <button type="submit" class="nes-btn is-primary">{{ page_name }}</button>
        </form>
        <!-- {% with messages = get_flashed_messages() %}
        {% for message in messages %}
        <p id="flashed-messages" class="mt-2"">{{ message }}</p>
        {% endfor %}
        {% endwith %} -->
        <p class=" mt-auto mb-0">{% block footer %}{% endblock %}</p>
    </div>
</div>
{% endblock %}
