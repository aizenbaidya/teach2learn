{% extends "base.html" %}

{% block title %}{{ page_name }}{% endblock %}

{% block head %}
<script type="module" src="{{ url_for('static', filename='dist/auth-base.js') }}" defer></script>
{% endblock %}

{% block content %}
<div class="vh-100 p-4 d-flex justify-content-center">
    <div class="nes-container h-100 w-50 d-flex flex-column">
        <h1 class="mb-4">{{ page_name }}</h1>
        <form method="post" class="d-flex flex-column flex-grow-1 gap-4">
            <div class="nes-field d-flex flex-column">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="nes-input w-auto" autofocus required>
            </div>
            <div class="nes-field d-flex flex-column">
                <label for="password">Password</label>
                <div class="position-relative d-flex flex-column">
                    <input type="password" name="password" id="password-input" class="nes-input w-auto" required>
                    <button id="eye-button" type="button"
                        class="border-0 p-0 bg-transparent me-1 position-absolute top-50 end-0 translate-middle-y m-0">
                        <i class="nes-icon eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="nes-btn is-primary">{{ page_name }}</button>
        </form>
        <p class="mt-auto mb-0">{% block footer %}{% endblock %}</p>
    </div>
</div>
{% endblock %}
