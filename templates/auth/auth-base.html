{% extends "base.html" %}

{% block title %}{{ page_name }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='dist/auth-base.css') }}">
<script type="module" src="{{ url_for('static', filename='dist/auth-base.js') }}" defer></script>
{% endblock %}

{% block content %}
<div class="vh-100 p-4 d-flex justify-content-center">
    <div class="nes-container h-100 w-50 d-flex flex-column">
        <h1 class="mb-4">{{ page_name }}</h1>
        <form id="auth-form" method="post" class="d-flex flex-column flex-grow-1 gap-4" novalidate>
            <div class="nes-field d-flex flex-column">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="nes-input w-auto" autofocus required>
                <span id="username-error" class="error-text nes-text is-error d-none">Username is required!</span>
            </div>
            <div class="nes-field d-flex flex-column">
                <label for="password-input">Password</label>
                <div id="password-div" class="nes-input w-auto d-flex align-items-center gap-2">
                    <input type="password" name="password" id="password-input"
                        class="border-0 bg-transparent p-0 flex-grow-1 me-3" required>
                    <button id="eye-button" type="button" class="border-0 p-0 bg-transparent d-flex align-items-center">
                        <i id="eye-icon" class="nes-icon eye is-small"></i>
                    </button>
                </div>
                <span id="password-error" class="error-text nes-text is-error d-none">Password is required!</span>
            </div>
            <button type="submit" class="nes-btn is-primary">{{ page_name }}</button>
        </form>
        <p class="mt-auto mb-0">{% block footer %}{% endblock %}</p>
    </div>
</div>
{% endblock %}
