{% extends "base.html" %}

{% block title %}{{ page_name }}{% endblock %}

{% block content %}
<div class="vh-100 p-4 d-flex justify-content-center">
    <div class="nes-container w-50 h-100">
        <h1 class="mb-4">{{ page_name }}</h1>
        <form method="post" class="d-flex flex-column gap-4">
            <div>
                <label for="username">Username</label>
                <input name="username" id="username" class="nes-input" required>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="nes-input" required>
            </div>
            <button type="submit" class="nes-btn is-primary">{{ page_name }}</button>
        </form>
    </div>
</div>
{% endblock %}
