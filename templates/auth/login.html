{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="vh-100 p-4 d-flex justify-content-center">
    <div class="nes-container h-100 w-50 d-flex flex-column">
        <h1 class="mb-4">Login</h1>
        <form method="post" class="d-flex flex-column flex-grow-1 gap-4">
            <div class="nes-field d-flex flex-column">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="nes-input w-auto" autofocus required>
            </div>
            <div class="nes-field d-flex flex-column">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="nes-input w-auto" required>
            </div>
            <button type="submit" class="nes-btn is-primary">Login</button>
        </form>
        <p class="mt-auto mb-0">No account? <a href="{{ url_for('auth.signup') }}">Signup</a>!</p>
    </div>
</div>
{% endblock %}
