services:
    app:
        build: .
        ports:
            - 8000:8000
        depends_on:
            db:
                condition: service_healthy
    db:
        image: postgres:18
        env_file: .env
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -h db -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
