services:
    app:
        container_name: app
        build: .
        command: flask run --debug --host 0.0.0.0
        image: app
        ports:
            - 5000:5000
        develop:
            watch:
                - action: sync
                  path: ./templates
                  target: /app/templates
                - action: sync
                  path: ./static
                  target: /app/static
