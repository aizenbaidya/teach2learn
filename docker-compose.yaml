services:
    mydb:
        image: postgres:18
        container_name: mydb
        environment:
            POSTGRES_DB: mydb
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "5432:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    teach2learn:
        image: teach2learn
        build: .
        container_name: teach2learn
        env_file: .env
        ports:
            - "5000:5000"
        depends_on:
            mydb:
                condition: service_healthy
